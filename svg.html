<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG图标</title>
    <script src ="http://at.alicdn.com/t/c/font_5238944_7c97evqqox7.js"></script>
    <link rel="stylesheet" href="./svg.css">
</head>
<body>
    <h2>SVG图标</h2>
    <div class="tab-nav">
        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use href="#icon-save"></use>
            </svg>
            <span>保存</span>
        </div>
        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use href="#icon-close"></use>
            </svg>
            <span>关闭</span>
        </div>
        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use href="#icon-search"></use>
            </svg>
            <span>搜索</span>
        </div>
        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use href="#icon-imgage"></use>
            </svg>
            <span>图库</span>
        </div>
        <script>
            function changeTab(current) {
            var items = document.querySelectorAll('.tab-item')
            for (var i = 0; i < items.length; i++) {
            items[i].classList.remove('active')
        }
        current.classList.add('active')
    }
        </script>
</body>
</html>
