<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诗词列表 · 上图下文</title>
<!--
  作者: 杨婷婷
  建立时间: 2026-11-12
  使用模型: Trae
  功能名称: 诗词列表页
  功能简介: 上图下文结构展示诗词——图片在上、标题和内容在下
           数据从本地 Node.js 服务器 (端口 3004) 动态获取
           服务器文件: db/server.js，启动命令: node db/server.js
           接口地址: http://localhost:3004/api/poems
-->
<style>
  /* ===== Reset & 基础 ===== */
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:system-ui,"PingFang SC","Microsoft YaHei","Noto Serif SC",serif;
    background:linear-gradient(180deg,#fdf8f3 0%,#f5ede2 100%);
    color:#2c1810;
    min-height:100vh;
    padding:24px 16px 60px;
  }

  /* ===== 顶部导航 ===== */
  .ytt_top{max-width:960px;margin:0 auto 20px;display:flex;justify-content:space-between;align-items:center;}
  .ytt_home{color:#8b6f47;text-decoration:none;font-size:13px;}
  .ytt_home:hover{color:#5a4430;}
  .ytt_sub{font-family:"SF Mono",Consolas,monospace;font-size:11px;color:#8b6f47;letter-spacing:.1em;}

  /* ===== 标题栏 ===== */
  .ytt_head{
    max-width:960px;margin:0 auto 28px;
    background:linear-gradient(135deg,#3d2914,#8b5a2b);
    border-radius:16px;padding:32px 36px;color:#fff;
    box-shadow:0 12px 30px rgba(61,41,20,.25);
  }
  .ytt_head h1{font-size:24px;margin-bottom:10px;letter-spacing:2px;}
  .ytt_head p{font-size:14px;color:#e8d5bf;line-height:1.9;}
  .ytt_head b{color:#ffd97a;}

  /* ===== 加载/错误/空状态 ===== */
  .ytt_state{
    max-width:960px;margin:0 auto;padding:60px 20px;
    text-align:center;color:#8b6f47;font-size:14px;
  }
  .ytt_state .ytt_loading-emoji{font-size:40px;margin-bottom:12px;display:block;}
  .ytt_state .ytt_error-btn{
    margin-top:14px;padding:8px 22px;border:none;border-radius:999px;
    background:#8b5a2b;color:#fff;font-size:13px;cursor:pointer;
  }

  /* ===== 卡片网格（上图下文） ===== */
  .ytt_grid{
    max-width:960px;margin:0 auto;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:24px;
  }

  /* ===== 卡片 ===== */
  .ytt_card{
    background:#fff;border-radius:14px;overflow:hidden;
    border:1px solid #e8dcc8;
    box-shadow:0 4px 16px rgba(61,41,20,.08);
    transition:transform .3s ease, box-shadow .3s ease;
    display:flex;flex-direction:column;
  }
  .ytt_card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(61,41,20,.16);}

  /* ===== 上图 ===== */
  .ytt_img-wrap{
    width:100%;aspect-ratio:4/3;overflow:hidden;
    background:#e8dcc8;position:relative;
  }
  .ytt_img-wrap img{
    width:100%;height:100%;object-fit:cover;
    transition:transform .5s ease;
  }
  .ytt_card:hover .ytt_img-wrap img{transform:scale(1.06);}
  /* 图片加载失败时显示占位 */
  .ytt_img-wrap .ytt_img-fallback{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#d4b896,#e8dcc8);color:#8b6f47;
    font-size:40px;
  }

  /* ===== 下文 ===== */
  .ytt_content{padding:18px 20px 22px;flex:1;display:flex;flex-direction:column;}
  .ytt_title{
    font-size:18px;font-weight:600;color:#3d2914;margin-bottom:10px;
    letter-spacing:1px;
    border-left:3px solid #8b5a2b;padding-left:10px;
  }
  .ytt_poem{
    font-size:14px;color:#5a4430;line-height:2;margin-bottom:14px;
    font-family:"Noto Serif SC","Songti SC","SimSun",serif;
  }
  .ytt_meta{
    margin-top:auto;display:flex;justify-content:space-between;align-items:center;
    font-family:"SF Mono",Consolas,monospace;font-size:11px;color:#a88a60;
  }
  .ytt_meta .ytt_index{
    background:#f5ede2;padding:2px 10px;border-radius:999px;
    letter-spacing:.15em;
  }

  /* ===== 页脚说明 ===== */
  .ytt_footer{
    max-width:960px;margin:36px auto 0;
    background:#fff;border:1px dashed #d4b896;border-radius:12px;
    padding:16px 22px;font-size:12.5px;color:#8b6f47;line-height:1.9;
  }
  .ytt_footer code{
    background:#f5ede2;padding:1px 8px;border-radius:4px;
    font-family:"SF Mono",Consolas,monospace;font-size:12px;color:#5a4430;
  }

  /* ===== 响应式 ===== */
  @media(max-width:680px){
    .ytt_head{padding:22px 22px;}
    .ytt_head h1{font-size:20px;}
    .ytt_grid{grid-template-columns:1fr;gap:20px;}
  }
</style>
</head>
<body>

<div class="ytt_top">
  <a href="index.html" class="ytt_home">← 返回首页</a>
  <span class="ytt_sub">POEMS · API · LOCALHOST:3004</span>
</div>

<div class="ytt_head">
  <h1>诗词列表 <b>· 上图下文</b></h1>
  <p>数据从本地 Node.js 服务器动态获取（端口 <b>3004</b>）。图片在上，诗词名和内容在下。</p>
</div>

<!-- 加载/错误/空状态提示 -->
<div id="ytt_state" class="ytt_state">
  <span class="ytt_loading-emoji">📜</span>
  <div id="ytt_state_text">正在加载诗词……</div>
</div>

<!-- 卡片网格（由 JS 动态填充） -->
<div id="ytt_grid" class="ytt_grid"></div>

<!-- 页脚说明 -->
<div class="ytt_footer">
  <b>💡 使用说明：</b><br>
  1️⃣ 先在终端执行 <code>node db/server.js</code> 启动数据服务器<br>
  2️⃣ 看到 "诗词数据服务器已启动 · 端口 3004" 后刷新本页<br>
  3️⃣ 服务器文件位于 <code>db/server.js</code>，数据文件 <code>db/db.json</code><br>
  4️⃣ 直接访问 <code>http://localhost:3004/api/poems</code> 可以看到原始 JSON
</div>

<script>
/* ===== 配置 ===== */
const YTT_API_URL = 'http://localhost:3004/api/poems';   // 数据接口地址

/* ===== ytt_setState =====
 * 功能: 显示加载中 / 错误 / 空数据三种状态
 * 参数: type - 'loading' | 'error' | 'empty'
 *       msg  - 要显示的文字
 * 返回: 无
 */
function ytt_setState(type, msg) {
  const box = document.getElementById('ytt_state');
  const text = document.getElementById('ytt_state_text');
  const grid = document.getElementById('ytt_grid');

  if (type === 'loading') {
    box.style.display = 'block';
    box.innerHTML = '<span class="ytt_loading-emoji">📜</span><div>' + (msg || '正在加载诗词……') + '</div>';
    grid.innerHTML = '';
  } else if (type === 'error') {
    box.style.display = 'block';
    box.innerHTML = '<span class="ytt_loading-emoji" style="font-size:48px;">⚠️</span>'
                  + '<div style="color:#b45309;font-size:14px;">' + msg + '</div>'
                  + '<button class="ytt_error-btn" onclick="ytt_fetchPoems()">重试</button>'
                  + '<div style="margin-top:12px;font-size:12px;">请先在终端执行 <code>node db/server.js</code> 启动数据服务器</div>';
    grid.innerHTML = '';
  } else if (type === 'empty') {
    box.style.display = 'block';
    box.innerHTML = '<span class="ytt_loading-emoji">🍃</span><div>暂无诗词数据</div>';
    grid.innerHTML = '';
  } else {
    box.style.display = 'none';
  }
}

/* ===== ytt_renderPoems =====
 * 功能: 把 poems 数组渲染成卡片网格（上图下文）
 * 参数: poems - 数组，每项 { title, content, pic }
 * 返回: 无
 */
function ytt_renderPoems(poems) {
  const grid = document.getElementById('ytt_grid');
  grid.innerHTML = '';

  poems.forEach(function(item, index) {
    const card = document.createElement('div');
    card.className = 'ytt_card';

    card.innerHTML =
      '<div class="ytt_img-wrap">'
        + '<img src="' + item.pic + '" alt="' + item.title + '" loading="lazy" onerror="ytt_imgError(this)">'
      + '</div>'
      + '<div class="ytt_content">'
        + '<div class="ytt_title">' + item.title + '</div>'
        + '<div class="ytt_poem">' + item.content + '</div>'
        + '<div class="ytt_meta">'
          + '<span class="ytt_index">#' + (index + 1).toString().padStart(2, '0') + '</span>'
          + '<span>POEM</span>'
        + '</div>'
      + '</div>';

    grid.appendChild(card);
  });

  ytt_setState('none');   // 隐藏状态提示
}

/* ===== ytt_imgError =====
 * 功能: 图片加载失败时替换成占位符
 * 参数: img - 出错的 img DOM 元素
 * 返回: 无
 */
function ytt_imgError(img) {
  const fallback = document.createElement('div');
  fallback.className = 'ytt_img-fallback';
  fallback.textContent = '🎋';
  img.replaceWith(fallback);
}

/* ===== ytt_fetchPoems =====
 * 功能: 从本地数据服务器 fetch 诗词列表
 * 参数: 无
 * 返回: Promise<void>
 */
function ytt_fetchPoems() {
  ytt_setState('loading', '正在连接数据服务器 ' + YTT_API_URL + ' ……');

  fetch(YTT_API_URL, { method: 'GET' })
    .then(function(resp) {
      if (!resp.ok) {
        throw new Error('HTTP ' + resp.status + ' ' + resp.statusText);
      }
      return resp.json();
    })
    .then(function(data) {
      if (!data || !Array.isArray(data) || data.length === 0) {
        ytt_setState('empty');
        return;
      }
      ytt_renderPoems(data);
    })
    .catch(function(err) {
      console.error('诗词加载失败:', err);
      ytt_setState(
        'error',
        '连接数据服务器失败：' + err.message + '<br>'
        + '请确认 <code>db/server.js</code> 是否在运行（端口 3004）'
      );
    });
}

/* ===== ytt_init =====
 * 功能: 页面加载完成后自动触发数据获取
 * 参数: 无
 * 返回: 无
 */
function ytt_init() {
  ytt_fetchPoems();
}

// DOM 就绪后启动
document.addEventListener('DOMContentLoaded', ytt_init);
</script>

</body>
</html>
